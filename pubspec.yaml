name: gorditos
description: "GorditOS — hábitos saludables sin presión. Motivar, nunca presionar."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.0.10
  go_router: ^17.3.0
  google_fonts: ^6.2.1
  shared_preferences: ^2.5.5
  supabase_flutter: ^2.14.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/brand/app_icon.png"
  adaptive_icon_background: "#FBF4E9"
  adaptive_icon_foreground: "assets/brand/app_icon.png"
