<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-app);}
  .grp{margin-bottom:20px;}
  .grp h4{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-500);margin:0 0 10px;}
  .row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;}
  .stack{max-width:320px;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
  const { Input, Switch, SegmentedControl } = window.GorditOSDesignSystem_613d73;
  function Demo(){
    const [nivel,setNivel] = React.useState('ritmo');
    const [on,setOn] = React.useState(true);
    return (<>
      <div className="grp"><h4>Input</h4><div className="row stack" style={{flexDirection:'column',alignItems:'stretch'}}>
        <Input label="¿Cómo te llamamos?" placeholder="Tu nombre" />
        <Input label="Hábito personalizado" hint="Lo añadimos a tu pantalla de Hoy" placeholder="Ej. estiramientos" />
      </div></div>
      <div className="grp"><h4>Segmented — nivel de ejercicio</h4><div className="row">
        <SegmentedControl value={nivel} onChange={setNivel} options={[
          {value:'empezando',label:'Empezando'},
          {value:'ritmo',label:'Cogiendo ritmo'},
          {value:'marcha',label:'En marcha'},
        ]}/>
      </div></div>
      <div className="grp"><h4>Switch</h4><div className="row">
        <Switch checked={on} onChange={e=>setOn(e.target.checked)} label="Tip diario de Gordi" />
        <span style={{fontFamily:'var(--font-body)',color:'var(--ink-700)'}}>Tip diario de Gordi</span>
      </div></div>
    </>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
