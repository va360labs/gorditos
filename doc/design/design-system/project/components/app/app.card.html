<!-- @dsCard group="Components" viewport="700x420" name="App — Habit tile, Garden, Bottom nav" subtitle="The 1-tap habit, the jardín de hábitos, and the tab bar." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-app);}
  .wrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:10px;flex:1;min-width:280px;}
  .col h4,.gcol h4{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-500);margin:0 0 4px;}
  .gcol{width:230px;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
  const { HabitTile, GardenGrid, BottomNav } = window.GorditOSDesignSystem_613d73;
  function Demo(){
    const [done,setDone] = React.useState({agua:true, ejercicio:false, comida:true});
    const [tab,setTab] = React.useState('hoy');
    const t = k => setDone(d=>({...d,[k]:!d[k]}));
    const days = ['grown','bloom','sprout','soil','grown','grown','bloom','soil','sprout','grown','grown','soil','bloom','grown','grown','sprout','soil','grown','bloom','grown','soil'];
    return (<div className="wrap">
      <div className="col">
        <h4>Habit tile — 1 tap</h4>
        <HabitTile icon="💧" name="Beber agua" meta="6/8 vasos" color="var(--habit-agua)" done={done.agua} onToggle={()=>t('agua')} />
        <HabitTile icon="🤸" name="Moverme un poco" meta="Rutina suave · 10 min" color="var(--habit-ejercicio)" done={done.ejercicio} onToggle={()=>t('ejercicio')} />
        <HabitTile icon="🥗" name="Comida casera" meta="Hoy: salteado exprés" color="var(--habit-comida)" done={done.comida} onToggle={()=>t('comida')} />
        <BottomNav current={tab} onChange={setTab} items={[
          {id:'hoy',icon:'☀️',label:'Hoy'},
          {id:'jardin',icon:'🌱',label:'Jardín'},
          {id:'gordi',icon:'💬',label:'Gordi'},
          {id:'cocina',icon:'🥗',label:'Cocina'},
        ]} />
      </div>
      <div className="gcol">
        <h4>Jardín de hábitos</h4>
        <GardenGrid columns={7} days={days} />
      </div>
    </div>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
