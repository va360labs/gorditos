<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--bg-app);}
  .grp{margin-bottom:18px;}
  .grp h4{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--ink-500);margin:0 0 10px;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body>
<div id="root"></div>
<script type="text/babel">
  const { Button, IconButton, Badge, Chip, Card, Avatar } = window.GorditOSDesignSystem_613d73;
  function Demo(){
    const [sel,setSel] = React.useState('rapido');
    return (<>
      <div className="grp"><h4>Button — variants</h4><div className="row">
        <Button variant="primary">Primary</Button>
        <Button variant="secondary">Secondary</Button>
        <Button variant="soft" icon="＋">Soft</Button>
        <Button variant="outline">Outline</Button>
        <Button variant="ghost">Ghost</Button>
        <Button variant="primary" disabled>Disabled</Button>
      </div></div>
      <div className="grp"><h4>Button — sizes</h4><div className="row">
        <Button size="sm">Pequeño</Button>
        <Button size="md">Mediano</Button>
        <Button size="lg">Grande</Button>
        <IconButton label="ajustes">⚙️</IconButton>
        <IconButton label="cerrar" bare>✕</IconButton>
      </div></div>
      <div className="grp"><h4>Badge & Chip</h4><div className="row">
        <Badge tone="green">Logro</Badge>
        <Badge tone="apricot" mono>12 días activos</Badge>
        <Badge tone="sky">Calma</Badge>
        <Badge tone="berry">Nuevo</Badge>
        <Badge tone="neutral">Borrador</Badge>
        <Chip selected={sel==='rapido'} onClick={()=>setSel('rapido')}>≤30 min</Chip>
        <Chip selected={sel==='nevera'} onClick={()=>setSel('nevera')} icon="🧊">Lo que tengo</Chip>
      </div></div>
      <div className="grp"><h4>Card & Avatar</h4><div className="row">
        <Card style={{flex:1}}><div style={{display:'flex',gap:10,alignItems:'center'}}>
          <Avatar src="../../assets/gordi.svg" size={44} alt="Gordi"/>
          <div><div style={{fontFamily:'var(--font-display)',fontWeight:700}}>Hola, Valen</div>
          <div style={{fontSize:13,color:'var(--ink-500)'}}>¿Empezamos suave hoy?</div></div>
        </div></Card>
        <Card variant="tint" style={{flex:1}}>Panel tintado para tips e info.</Card>
      </div></div>
    </>);
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
</body></html>
