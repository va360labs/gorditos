<!-- @dsCard group="Spacing" viewport="700x160" name="Spacing scale" subtitle="4px base grid. space-1 (4) → space-16 (64)." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 24px;background:var(--bg-app);display:flex;align-items:flex-end;gap:14px}
  .col{display:flex;flex-direction:column;align-items:center;gap:6px}
  .bar{background:var(--green-400);border-radius:var(--radius-xs)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-500)}
</style></head><body>
  <div class="col"><div class="bar" style="width:4px;height:var(--space-4)"></div><span class="lbl">1·4</span></div>
  <div class="col"><div class="bar" style="width:8px;height:var(--space-4)"></div><span class="lbl">2·8</span></div>
  <div class="col"><div class="bar" style="width:12px;height:var(--space-6)"></div><span class="lbl">3·12</span></div>
  <div class="col"><div class="bar" style="width:16px;height:var(--space-6)"></div><span class="lbl">4·16</span></div>
  <div class="col"><div class="bar" style="width:20px;height:var(--space-8)"></div><span class="lbl">5·20</span></div>
  <div class="col"><div class="bar" style="width:24px;height:var(--space-8)"></div><span class="lbl">6·24</span></div>
  <div class="col"><div class="bar" style="width:32px;height:var(--space-10)"></div><span class="lbl">8·32</span></div>
  <div class="col"><div class="bar" style="width:40px;height:var(--space-10)"></div><span class="lbl">10·40</span></div>
  <div class="col"><div class="bar" style="width:48px;height:var(--space-12)"></div><span class="lbl">12·48</span></div>
  <div class="col"><div class="bar" style="width:64px;height:var(--space-12)"></div><span class="lbl">16·64</span></div>
</body></html>
