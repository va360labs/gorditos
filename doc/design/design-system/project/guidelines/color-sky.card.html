<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-app);display:flex;gap:8px}
  .sw{flex:1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:9px;min-height:108px}
  .sw .n{font-family:var(--font-body);font-weight:800;font-size:12px}
  .sw .h{font-family:var(--font-mono);font-size:10px;opacity:.85}
  .d{color:#fff}.l{color:var(--ink-900)}
  .star{outline:3px solid var(--ink-900);outline-offset:2px}
</style></head><body>
  <div class="sw l" style="background:var(--sky-50)"><span class="n">50</span><span class="h">#E7F3F8</span></div>
  <div class="sw l" style="background:var(--sky-100)"><span class="n">100</span><span class="h">#C9E5EF</span></div>
  <div class="sw l" style="background:var(--sky-300)"><span class="n">300</span><span class="h">#93CFE2</span></div>
  <div class="sw l star" style="background:var(--sky-500)"><span class="n">500 ★</span><span class="h">#57B0CF</span></div>
  <div class="sw d" style="background:var(--sky-600)"><span class="n">600</span><span class="h">#3A93B4</span></div>
  <div class="sw d" style="background:var(--sky-700)"><span class="n">700</span><span class="h">#2A7191</span></div>
</body></html>
