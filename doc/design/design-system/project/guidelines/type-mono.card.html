<!-- @dsCard group="Type" viewport="700x160" name="Mono — DM Mono & the OS accent" subtitle="System labels, stat chips, and the tracked-out 'OS' wordmark." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--bg-app);display:flex;flex-direction:column;gap:14px}
  .word{font-family:var(--font-display);font-weight:800;font-size:34px;color:var(--ink-900)}
  .word .os{font-family:var(--font-mono);font-weight:500;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--green-600);font-size:26px}
  .chips{display:flex;gap:8px}
  .chip{font-family:var(--font-mono);font-size:13px;background:var(--green-50);color:var(--green-700);border:1px solid var(--green-100);border-radius:var(--radius-md);padding:6px 12px}
</style></head><body>
  <div class="word">Gordit<span class="os">OS</span></div>
  <div class="chips">
    <span class="chip">12 días activos</span>
    <span class="chip">+500 pasos</span>
    <span class="chip">≤30 min</span>
  </div>
</body></html>
