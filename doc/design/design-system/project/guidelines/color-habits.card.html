<!-- @dsCard group="Colors" viewport="700x160" name="Habit categories" subtitle="Each habit family owns a color across the garden." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-app);display:flex;gap:10px}
  .h{flex:1;border-radius:var(--radius-lg);background:var(--surface-card);box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:12px}
  .dot{width:40px;height:40px;border-radius:var(--radius-pill)}
  .lbl{font-family:var(--font-body);font-weight:700;font-size:13px;color:var(--ink-900)}
  .tok{font-family:var(--font-mono);font-size:10px;color:var(--ink-500)}
</style></head><body>
  <div class="h"><div class="dot" style="background:var(--habit-agua)"></div><span class="lbl">Agua</span><span class="tok">--habit-agua</span></div>
  <div class="h"><div class="dot" style="background:var(--habit-ejercicio)"></div><span class="lbl">Ejercicio</span><span class="tok">--habit-ejercicio</span></div>
  <div class="h"><div class="dot" style="background:var(--habit-comida)"></div><span class="lbl">Comida</span><span class="tok">--habit-comida</span></div>
  <div class="h"><div class="dot" style="background:var(--habit-sueno)"></div><span class="lbl">Sueño</span><span class="tok">--habit-sueno</span></div>
  <div class="h"><div class="dot" style="background:var(--habit-calma)"></div><span class="lbl">Calma</span><span class="tok">--habit-calma</span></div>
  <div class="h"><div class="dot" style="background:var(--habit-pasos)"></div><span class="lbl">Pasos</span><span class="tok">--habit-pasos</span></div>
</body></html>
