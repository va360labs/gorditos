<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows" subtitle="Soft, warm brown-tinted elevation. Plus brand & apricot glows." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px;background:var(--bg-app);display:flex;gap:18px;align-items:center;flex-wrap:wrap}
  .col{display:flex;flex-direction:column;align-items:center;gap:10px}
  .box{width:78px;height:60px;background:var(--surface-card);border-radius:var(--radius-lg)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-500)}
</style></head><body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><span class="lbl">xs</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="lbl">sm</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="lbl">md</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="lbl">lg</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="lbl">xl</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-brand);background:var(--green-500)"></div><span class="lbl">brand</span></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-apricot);background:var(--apricot-500)"></div><span class="lbl">apricot</span></div>
</body></html>
