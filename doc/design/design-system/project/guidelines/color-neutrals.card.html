<!-- @dsCard group="Colors" viewport="700x180" name="Neutrals — Sand & Ink" subtitle="Warm paper backgrounds + warm near-black text. Never pure gray." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-app);display:flex;flex-direction:column;gap:8px}
  .row{display:flex;gap:8px;flex:1}
  .sw{flex:1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:9px;border:1px solid rgba(0,0,0,.05)}
  .sw .n{font-family:var(--font-body);font-weight:800;font-size:12px}
  .sw .h{font-family:var(--font-mono);font-size:10px;opacity:.8}
  .d{color:#fff}.l{color:var(--ink-900)}
</style></head><body>
  <div class="row">
    <div class="sw l" style="background:var(--sand-50)"><span class="n">sand-50</span><span class="h">#FDFAF4</span></div>
    <div class="sw l" style="background:var(--sand-100)"><span class="n">sand-100 · bg</span><span class="h">#FBF4E9</span></div>
    <div class="sw l" style="background:var(--sand-200)"><span class="n">sand-200</span><span class="h">#F4EADB</span></div>
    <div class="sw l" style="background:var(--sand-300)"><span class="n">sand-300</span><span class="h">#E9DAC4</span></div>
    <div class="sw l" style="background:var(--sand-400)"><span class="n">sand-400</span><span class="h">#D6C2A4</span></div>
    <div class="sw d" style="background:var(--sand-500)"><span class="n">sand-500</span><span class="h">#BBA47F</span></div>
  </div>
  <div class="row">
    <div class="sw l" style="background:var(--paper)"><span class="n">paper · card</span><span class="h">#FFFDF9</span></div>
    <div class="sw d" style="background:var(--ink-400)"><span class="n">ink-400</span><span class="h">#9E9384</span></div>
    <div class="sw d" style="background:var(--ink-500)"><span class="n">ink-500</span><span class="h">#7C7264</span></div>
    <div class="sw d" style="background:var(--ink-700)"><span class="n">ink-700</span><span class="h">#4E473D</span></div>
    <div class="sw d" style="background:var(--ink-900)"><span class="n">ink-900 · text</span><span class="h">#2B2722</span></div>
  </div>
</body></html>
