<!-- @dsCard group="Colors" viewport="700x150" name="Secondary — Apricot (celebration)" subtitle="Joy, food, celebrations & confetti. apricot-500." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-app);display:flex;gap:8px}
  .sw{flex:1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:9px;min-height:108px}
  .sw .n{font-family:var(--font-body);font-weight:800;font-size:12px}
  .sw .h{font-family:var(--font-mono);font-size:10px;opacity:.85}
  .d{color:#fff}.l{color:var(--ink-900)}
  .star{outline:3px solid var(--ink-900);outline-offset:2px}
</style></head><body>
  <div class="sw l" style="background:var(--apricot-50)"><span class="n">50</span><span class="h">#FDF1E5</span></div>
  <div class="sw l" style="background:var(--apricot-100)"><span class="n">100</span><span class="h">#FBE0C7</span></div>
  <div class="sw l" style="background:var(--apricot-300)"><span class="n">300</span><span class="h">#F8C28C</span></div>
  <div class="sw l star" style="background:var(--apricot-500)"><span class="n">500 ★</span><span class="h">#F2A24E</span></div>
  <div class="sw d" style="background:var(--apricot-600)"><span class="n">600</span><span class="h">#E2872B</span></div>
  <div class="sw d" style="background:var(--apricot-700)"><span class="n">700</span><span class="h">#BC6C1C</span></div>
</body></html>
