<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 22px;background:var(--bg-app);display:flex;gap:14px}
  .col{flex:1;border-radius:var(--radius-lg);padding:12px 14px}
  .yes{background:var(--green-50);border:1px solid var(--green-100)}
  .no{background:var(--clay-100);border:1px solid #EFCDB8}
  .tag{font-family:var(--font-mono);font-size:11px;letter-spacing:var(--ls-label);font-weight:500}
  .yes .tag{color:var(--green-700)}.no .tag{color:var(--clay-600)}
  ul{margin:8px 0 0;padding-left:16px}
  li{font-family:var(--font-body);font-size:13.5px;color:var(--ink-700);line-height:1.55}
</style></head><body>
  <div class="col yes">
    <span class="tag">✓ SÍ DECIMOS</span>
    <ul>
      <li>“Aquí no se pierde nada, se retoma.”</li>
      <li>“¿Empezamos suave hoy?”</li>
      <li>“12 días activos este mes 🌱”</li>
    </ul>
  </div>
  <div class="col no">
    <span class="tag">✕ NUNCA DECIMOS</span>
    <ul>
      <li>“Has roto tu racha.”</li>
      <li>“No llegaste a los 10.000 pasos.”</li>
      <li>“Calorías · peso · IMC.”</li>
    </ul>
  </div>
</body></html>
