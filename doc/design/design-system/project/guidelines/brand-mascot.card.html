<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px 28px;background:var(--bg-app);display:flex;align-items:center;gap:28px}
  .stage{background:var(--green-50);border-radius:var(--radius-2xl);padding:14px;display:flex;gap:10px}
  .stage img{width:120px;height:120px}
  .sm{width:60px;align-self:center}
  .copy{max-width:300px}
  .copy h3{font-family:var(--font-display);font-size:20px;color:var(--ink-900);margin-bottom:6px}
  .copy p{font-family:var(--font-body);font-size:14px;color:var(--ink-700);line-height:1.5}
  .bubble{margin-top:10px;background:var(--surface-card);border:1px solid var(--border-soft);border-radius:var(--radius-lg);border-bottom-left-radius:6px;padding:10px 14px;font-family:var(--font-body);font-weight:600;font-size:14px;color:var(--ink-900);box-shadow:var(--shadow-sm)}
</style></head><body>
  <div class="stage">
    <img src="../assets/gordi.svg" alt="Gordi grande">
    <img class="sm" src="../assets/gordi.svg" alt="Gordi pequeño">
  </div>
  <div class="copy">
    <h3>Gordi</h3>
    <p>Copiloto cercano y con humor amable. Acompaña, celebra y nunca juzga.</p>
    <div class="bubble">¿Empezamos suave hoy? Yo te acompaño 🌱</div>
  </div>
</body></html>
