<!-- @dsCard group="Spacing" viewport="700x170" name="Corner radii" subtitle="Generous, friendly rounding. xs 6 → pill. Cards = lg (20)." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 24px;background:var(--bg-app);display:flex;gap:14px;align-items:center}
  .col{display:flex;flex-direction:column;align-items:center;gap:8px}
  .box{width:74px;height:74px;background:var(--apricot-100);border:2px solid var(--apricot-500)}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);text-align:center}
</style></head><body>
  <div class="col"><div class="box" style="border-radius:var(--radius-xs)"></div><span class="lbl">xs · 6</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-sm)"></div><span class="lbl">sm · 10</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-md)"></div><span class="lbl">md · 14</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><span class="lbl">lg · 20</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><span class="lbl">xl · 28</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><span class="lbl">2xl · 36</span></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-pill)"></div><span class="lbl">pill</span></div>
</body></html>
