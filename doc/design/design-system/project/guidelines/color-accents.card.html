<!-- @dsCard group="Colors" viewport="700x150" name="Accents — Berry & Clay" subtitle="Berry = variety/badges. Clay = the only gentle 'attention' hue." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-app);display:flex;gap:8px}
  .sw{flex:1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:9px;min-height:108px}
  .sw .n{font-family:var(--font-body);font-weight:800;font-size:12px}
  .sw .h{font-family:var(--font-mono);font-size:10px;opacity:.85}
  .d{color:#fff}.l{color:var(--ink-900)}
</style></head><body>
  <div class="sw l" style="background:var(--berry-100)"><span class="n">berry-100</span><span class="h">#F7DBE5</span></div>
  <div class="sw d" style="background:var(--berry-500)"><span class="n">berry-500</span><span class="h">#D86A8E</span></div>
  <div class="sw d" style="background:var(--berry-600)"><span class="n">berry-600</span><span class="h">#C24E74</span></div>
  <div class="sw l" style="background:var(--clay-100)"><span class="n">clay-100</span><span class="h">#F8E2D4</span></div>
  <div class="sw d" style="background:var(--clay-500)"><span class="n">clay-500</span><span class="h">#E08A5D</span></div>
  <div class="sw d" style="background:var(--clay-600)"><span class="n">clay-600</span><span class="h">#C76E40</span></div>
</body></html>
