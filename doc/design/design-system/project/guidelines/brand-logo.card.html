<!-- @dsCard group="Brand" viewport="700x200" name="Logo & wordmark" subtitle="Gordi mark + 'Gordit' (Baloo) with the tracked-out 'OS' (mono) accent." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:24px 28px;background:var(--bg-app);display:flex;align-items:center;gap:32px}
  .lockup{display:flex;align-items:center;gap:14px}
  .lockup img{width:64px;height:64px}
  .word{font-family:var(--font-display);font-weight:800;font-size:42px;color:var(--ink-900);line-height:1}
  .word .os{font-family:var(--font-mono);font-weight:500;letter-spacing:var(--ls-wide);text-transform:uppercase;color:var(--green-600);font-size:31px}
  .icon{width:84px;height:84px;border-radius:var(--radius-xl);box-shadow:var(--shadow-md)}
  .div{width:1px;align-self:stretch;background:var(--sand-300)}
  .cap{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);margin-top:8px}
  .col{display:flex;flex-direction:column;align-items:center}
</style></head><body>
  <div>
    <div class="lockup"><img src="../assets/gordi.svg" alt="Gordi"><span class="word">Gordit<span class="os">OS</span></span></div>
    <div class="cap">PRIMARY LOCKUP · mark + wordmark</div>
  </div>
  <div class="div"></div>
  <div class="col"><img class="icon" src="../assets/app-icon.svg" alt="App icon"><span class="cap">APP ICON</span></div>
</body></html>
