<!-- @dsCard group="Colors" viewport="700x170" name="Garden states" subtitle="Empty day = soil (tierra), never a wilted plant. Growth only." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-app);display:flex;gap:10px}
  .s{flex:1;border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:14px;color:#fff}
  .s .lbl{font-family:var(--font-display);font-weight:700;font-size:15px}
  .s .tok{font-family:var(--font-mono);font-size:10px;opacity:.85}
  .dot{width:44px;height:44px;border-radius:var(--radius-pill);box-shadow:inset 0 -4px 8px rgba(0,0,0,.12)}
</style></head><body>
  <div class="s" style="background:var(--garden-soil)"><div class="dot" style="background:#B7A282"></div><span class="lbl">Tierra</span><span class="tok">--garden-soil</span></div>
  <div class="s" style="background:var(--garden-sprout)"><div class="dot" style="background:#5DBC8A"></div><span class="lbl">Brote</span><span class="tok">--garden-sprout</span></div>
  <div class="s" style="background:var(--garden-grown)"><div class="dot" style="background:#43AE79"></div><span class="lbl">Crecida</span><span class="tok">--garden-grown</span></div>
  <div class="s" style="background:var(--garden-bloom)"><div class="dot" style="background:#F6B265"></div><span class="lbl">Floreció</span><span class="tok">--garden-bloom</span></div>
</body></html>
