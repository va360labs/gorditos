<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="display 40 · h1 32 · h2 24 · h3 20 · lg 18 · base 16 · sm 14 · xs 12" -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:18px 24px;background:var(--bg-app)}
  .r{display:flex;align-items:baseline;gap:14px;padding:5px 0;border-bottom:1px dashed var(--sand-300)}
  .r:last-child{border:0}
  .tok{font-family:var(--font-mono);font-size:11px;color:var(--ink-500);width:120px;flex:none}
  .sp{color:var(--ink-900)}
  .d{font-family:var(--font-display);font-weight:700}
  .b{font-family:var(--font-body)}
</style></head><body>
  <div class="r"><span class="tok">--text-display</span><span class="sp d" style="font-size:var(--text-display)">Tu ritmo</span></div>
  <div class="r"><span class="tok">--text-h1</span><span class="sp d" style="font-size:var(--text-h1)">Hoy</span></div>
  <div class="r"><span class="tok">--text-h2</span><span class="sp d" style="font-size:var(--text-h2)">Tu jardín</span></div>
  <div class="r"><span class="tok">--text-h3</span><span class="sp d" style="font-size:var(--text-h3)">Recetas de hoy</span></div>
  <div class="r"><span class="tok">--text-lg</span><span class="sp b" style="font-size:var(--text-lg);font-weight:700">Lead / Gordi</span></div>
  <div class="r"><span class="tok">--text-base</span><span class="sp b" style="font-size:var(--text-base)">Texto de cuerpo</span></div>
  <div class="r"><span class="tok">--text-sm</span><span class="sp b" style="font-size:var(--text-sm)">Texto secundario</span></div>
  <div class="r"><span class="tok">--text-xs</span><span class="sp b" style="font-size:var(--text-xs)">Captions y etiquetas</span></div>
</body></html>
