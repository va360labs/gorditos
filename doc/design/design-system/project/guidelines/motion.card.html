<!-- @dsCard group="Spacing" viewport="700x150" name="Motion" subtitle="Soft springy easing. Fades + gentle scale. Never abrupt, never loops on content." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px 24px;background:var(--bg-app);display:flex;gap:18px;align-items:center}
  .demo{display:flex;flex-direction:column;align-items:center;gap:10px}
  .ball{width:46px;height:46px;border-radius:var(--radius-pill);background:var(--green-500)}
  .b1{animation:bob 1.8s var(--ease-soft) infinite alternate}
  .b2{animation:bob 1.8s var(--ease-out) infinite alternate}
  @keyframes bob{from{transform:translateY(8px) scale(1)}to{transform:translateY(-8px) scale(1.06)}}
  .lbl{font-family:var(--font-mono);font-size:10px;color:var(--ink-500);text-align:center;line-height:1.4}
  .tokens{font-family:var(--font-mono);font-size:12px;color:var(--ink-700);line-height:1.9}
</style></head><body>
  <div class="demo"><div class="ball b1"></div><span class="lbl">ease-soft<br>(overshoot)</span></div>
  <div class="demo"><div class="ball b2" style="background:var(--apricot-500)"></div><span class="lbl">ease-out</span></div>
  <div class="tokens">
    --dur-fast 140ms · --dur-base 240ms · --dur-slow 420ms<br>
    --ease-soft · --ease-out · --ease-in-out
  </div>
</body></html>
