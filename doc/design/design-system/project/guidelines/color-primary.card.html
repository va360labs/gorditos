<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Verde (growth)" subtitle="Brand primary = green-500. The habit garden / growth." -->
<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:16px;background:var(--bg-app);display:flex;gap:8px}
  .sw{flex:1;border-radius:var(--radius-md);display:flex;flex-direction:column;justify-content:flex-end;padding:9px;min-height:108px}
  .sw .n{font-family:var(--font-body);font-weight:800;font-size:12px}
  .sw .h{font-family:var(--font-mono);font-size:10px;opacity:.85}
  .d{color:#fff}.l{color:var(--ink-900)}
  .star{outline:3px solid var(--ink-900);outline-offset:2px}
</style></head><body>
  <div class="sw l" style="background:var(--green-50)"><span class="n">50</span><span class="h">#E9F6EE</span></div>
  <div class="sw l" style="background:var(--green-100)"><span class="n">100</span><span class="h">#CFEBDA</span></div>
  <div class="sw l" style="background:var(--green-200)"><span class="n">200</span><span class="h">#A6DBBC</span></div>
  <div class="sw l" style="background:var(--green-300)"><span class="n">300</span><span class="h">#79C99C</span></div>
  <div class="sw l" style="background:var(--green-400)"><span class="n">400</span><span class="h">#4FB37E</span></div>
  <div class="sw d star" style="background:var(--green-500)"><span class="n">500 ★</span><span class="h">#2F9E66</span></div>
  <div class="sw d" style="background:var(--green-600)"><span class="n">600</span><span class="h">#248555</span></div>
  <div class="sw d" style="background:var(--green-700)"><span class="n">700</span><span class="h">#1B6A43</span></div>
  <div class="sw d" style="background:var(--green-800)"><span class="n">800</span><span class="h">#134E32</span></div>
</body></html>
