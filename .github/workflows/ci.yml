name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático (AC-09)
        run: flutter analyze

      - name: Copy-lint — glosario prohibido (AC-10)
        run: dart run tool/copy_lint.dart

      - name: Schema guard — anti-peso (AC-04)
        run: dart run tool/schema_guard.dart

      - name: Tests (AC-09)
        run: flutter test
